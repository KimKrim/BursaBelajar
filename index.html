    const u = $('bb-user').value.trim().toLowerCase(), p = $('bb-pass').value;
    if (!/^[a-z0-9_]{3,20}$/.test(u)) return gErr('Username 3–20 karakter: huruf kecil, angka, atau _');
    if (p.length < 6) return gErr('Password minimal 6 karakter');
    if (!sb) return gErr('SDK Supabase tidak termuat (cek koneksi internet)');
    const go = $('bb-go'); go.disabled = true; gErr('Memproses...');
    try {
      const cred = { email: u + '@' + EMAIL_DOMAIN, password: p };
      const r = mode === 'up' ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
      if (r.error) throw r.error;
      if (!r.data.session) throw new Error('confirm');
      gErr(''); $('bb-pass').value = '';
      await begin(r.data.session.user);
    } catch (e) { gErr(msg(e)); } finally { go.disabled = false; }
  }

  // ---------- sesi ----------
  const waitState = async () => { for (let i = 0; i < 100 && !(State && State.txHistory && State.portfolio); i++) await new Promise(r => setTimeout(r, 100)); };

  async function begin(u) {
    user = u; username = (u.email || '').split('@')[0]; nick = username;
    try { nick = localStorage.getItem('bb_nick_' + u.id) || username; } catch (e) {}
    gate.style.display = 'none'; document.body.style.overflow = '';
    status = 'Terhubung'; err = '';
    await waitState();
    subscribe(); fetchBoard();
    await restore();
    ready = true; paint();
  }

  function apply(st) {
    FIELDS.forEach(k => { if (st[k] !== undefined) State[k] = st[k]; });
    State.txHistory = Array.isArray(st.txHistory) ? st.txHistory.slice(0, 500) : [];
    MASTER_ASSETS.forEach(a => { if (!State.companyStatus[a[0]]) State.companyStatus[a[0]] = 'sehat'; });
    normalizeNewsFeed();
    saveState(); renderCurrentTab();
  }

  // login: riwayat dari cloud dipulihkan; akun baru mewarisi progres browser ini kalau browser belum milik akun lain
  async function restore() {
    let owner = ''; try { owner = localStorage.getItem('bb_owner') || ''; } catch (e) {}
    try {
      const { data, error } = await sb.from('saves').select('state,updated_at').eq('user_id', user.id).maybeSingle();
      if (error) throw error;
      try { localStorage.setItem('bb_owner', user.id); } catch (e) {}
      if (data) { apply(data.state); cloudUpdatedAt = data.updated_at || null; lastHash = hashOf(slim()); lastSyncAt = Date.now(); status = 'Tersinkron'; showToast('☁️ Riwayatmu dipulihkan'); }
      else if (owner && owner !== user.id) { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} location.reload(); }
      else await save(true);
    } catch (e) { fail('Muat', e); }
  }

  async function save(manual) {
    if (busy || !user) return; busy = true;
    try {
      const st = slim(), h = hashOf(st);
      if (!manual && h === lastHash) return;
      const nw = getNetWorth(); if (!isFinite(nw)) throw new Error('Kekayaan bersih tidak valid');
      let now = new Date().toISOString(), savedRow = null;

      if (cloudUpdatedAt) {
        let attempt = await sb.from('saves').update({ state: st, updated_at: now }).eq('user_id', user.id).eq('updated_at', cloudUpdatedAt).select('updated_at').maybeSingle();
        if (attempt.error) throw attempt.error;
        savedRow = attempt.data;
        if (!savedRow) {
          const latestResult = await sb.from('saves').select('state,updated_at').eq('user_id', user.id).maybeSingle();
          if (latestResult.error) throw latestResult.error;
          const latest = latestResult.data;
          if (!latest) throw new Error('Data cloud berubah atau terhapus. Muat ulang sebelum menyimpan.');
          const overwrite = confirm('Konflik sinkronisasi: cloud diperbarui dari tab/perangkat lain pada ' + new Date(latest.updated_at).toLocaleString('id-ID') + '. Pilih OK untuk menimpa versi cloud dengan progres perangkat ini; Cancel untuk memuat versi cloud yang lebih baru.');
          if (!overwrite) {
            apply(latest.state); cloudUpdatedAt = latest.updated_at; lastHash = hashOf(slim()); lastSyncAt = Date.now(); status = 'Konflik diselesaikan: cloud dimuat';
            showToast('☁️ Versi cloud yang lebih baru dimuat; progres lokal diganti agar tidak saling menimpa.');
            return;
          }
          now = new Date().toISOString();
          attempt = await sb.from('saves').update({ state: st, updated_at: now }).eq('user_id', user.id).eq('updated_at', latest.updated_at).select('updated_at').maybeSingle();
          if (attempt.error) throw attempt.error;
          if (!attempt.data) throw new Error('Cloud berubah lagi saat konflik diselesaikan. Muat cloud lalu coba simpan ulang.');
          savedRow = attempt.data;
        }
      } else {
        const inserted = await sb.from('saves').insert({ user_id: user.id, state: st, updated_at: now }).select('updated_at').maybeSingle();
        if (inserted.error) {
          if (/duplicate|unique/i.test(inserted.error.message || '')) throw new Error('Data cloud sudah dibuat dari perangkat lain. Muat ulang cloud sebelum menyimpan.');
          throw inserted.error;
        }
        savedRow = inserted.data;
      }

      cloudUpdatedAt = (savedRow && savedRow.updated_at) || now;
      const leaderboardResult = await sb.from('leaderboard').upsert({ user_id: user.id, nickname: nick, networth: Math.round(nw), updated_at: new Date().toISOString() });
      if (leaderboardResult.error) throw leaderboardResult.error;
      lastHash = h; lastSyncAt = Date.now(); err = ''; status = 'Tersinkron';
      if (manual) showToast('☁️ Tersimpan ke cloud');
      fetchBoard();
    } catch (e) { status = 'Gagal sinkron'; fail('Simpan', e); } finally { busy = false; paint(); }
  }

  async function load() {
    try {
      const { data, error } = await sb.from('saves').select('state,updated_at').eq('user_id', user.id).maybeSingle();
      if (error) throw error;
      if (!data) return showToast('Belum ada data di cloud');
      if (!confirm('Timpa progres di browser ini dengan data cloud (' + new Date(data.updated_at).toLocaleString('id-ID') + ')?')) return;
      apply(data.state); cloudUpdatedAt = data.updated_at || null; lastHash = hashOf(slim()); lastSyncAt = Date.now(); status = 'Tersinkron'; showToast('☁️ Data cloud dimuat');
    } catch (e) { fail('Muat', e); }
  }

  async function logout() {
    if (!confirm('Keluar dari akun? Progres disimpan dulu ke cloud.')) return;
    await save(true);
    if (status === 'Gagal sinkron' && !confirm('Sinkron gagal, progres terbaru bisa hilang. Tetap keluar?')) return;
    try { await sb.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem('bb_owner'); } catch (e) {}
    location.reload();
  }

  async function fetchBoard() {
    if (!sb || !user) return;
    try {
      const { data, error } = await sb.from('leaderboard').select('user_id,nickname,networth,updated_at').order('networth', { ascending: false }).limit(50);
      if (error) throw error;
      board = data || []; paint();
    } catch (e) { fail('Leaderboard', e); }
  }
  const fetchBoardSoon = () => { clearTimeout(boardTimer); boardTimer = setTimeout(fetchBoard, 400); };
  function subscribe() {
    if (rtOn || !sb) return; rtOn = true;
    sb.channel('lb-live').on('postgres_changes', { event: '*', schema: 'public', table: 'leaderboard' }, fetchBoardSoon).subscribe();
  }

  function view() {
    const me = user && user.id, nw = getNetWorth(), init = State.initialCapital || 50000000;
    const rows = board.map((r, i) => {
      const ret = (r.networth - init) / init, mine = r.user_id === me;
      return `<tr${mine ? ' style="background:var(--bg-card)"' : ''}><td>${i + 1}</td><td><b>${esc(r.nickname || '-')}</b>${mine ? ' (kamu)' : ''}</td><td>${rp(r.networth)}</td><td class="${ret >= 0 ? 'up' : 'down'}">${formatPercent(ret)}</td></tr>`;
    }).join('');
    return `<div class="card"><div class="card-head"><h2>☁️ Akun & Cloud Save</h2><span style="font-size:12px;color:var(--text-sub)">${esc(status)}${lastSyncAt ? ' · ' + new Date(lastSyncAt).toLocaleTimeString('id-ID') : ''}</span></div>
      <p style="font-size:13px;margin-bottom:10px">Masuk sebagai <b>${esc(username)}</b></p>
      ${err ? `<p class="down" style="font-size:12.5px;margin-bottom:10px">${esc(err)}</p>` : ''}
      <div class="field" style="max-width:320px"><label for="bb-nick">Nama di leaderboard</label><input id="bb-nick" maxlength="20" value="${esc(nick)}"></div>
      <div class="row-acts"><button class="btn btn-primary" onclick="BBcloud.save()">Simpan ke cloud</button><button class="btn" onclick="BBcloud.load()">Muat dari cloud</button><button class="btn" onclick="BBcloud.logout()">Keluar</button></div>
      <p style="font-size:12px;color:var(--text-sub);margin-top:10px;max-width:78ch">Progres otomatis tersimpan tiap ±1 menit dan terikat ke akunmu, jadi bisa dibuka dari browser atau perangkat mana pun dengan login yang sama. Skor dilaporkan dari browser dan tidak diverifikasi server.</p></div>
      <div class="card"><div class="card-head"><h2>🏆 Leaderboard (live)</h2><span style="font-size:12px;color:var(--text-sub)">Kekayaanmu saat ini: ${rp(nw)}</span></div>
      ${rows ? `<table><thead><tr><th>#</th><th>Pemain</th><th>Kekayaan Bersih</th><th>Imbal Hasil</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty"><b>Belum ada pemain</b><br>Klik "Simpan ke cloud" untuk masuk papan peringkat.</div>'}</div>`;
  }

  function paint() {
    if (currentTab !== 'leaderboard' || !user) return;
    const a = document.activeElement; if (a && a.id === 'bb-nick') return;
    $('app-view').innerHTML = view();
    const inp = $('bb-nick');
    if (inp) inp.onchange = () => {
      nick = inp.value.replace(/[<>&"']/g, '').trim().slice(0, 20) || nick; inp.value = nick;
      try { localStorage.setItem('bb_nick_' + user.id, nick); } catch (e) {} save(true);
    };
  }

  TABS.push(['leaderboard', '🏆 Leaderboard & Cloud']);
  const prevRender = window.renderCurrentTab;
  window.renderCurrentTab = function () {
    if (currentTab === 'leaderboard') { updateHeaderTime(); return paint(); }
    return prevRender.apply(this, arguments);
  };
  initNav();
  window.BBcloud = { save: () => save(true), load, logout };

  // start
  (async function () {
    try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); } catch (e) { gErr('Init: ' + e.message); }
    if (!sb) return gErr('SDK Supabase tidak termuat (cek koneksi internet)');
    try {
      const { data } = await sb.auth.getSession(), s = data && data.session;
      if (s && s.user && s.user.email) await begin(s.user);
      else if (s) await sb.auth.signOut(); // sesi anonim lama tidak dipakai lagi
    } catch (e) { gErr(msg(e)); }
  })();
  setInterval(() => { if (user && ready && State) save(false); }, SAVE_EVERY_MS);
  document.addEventListener('visibilitychange', () => { if (document.hidden && user && ready && State) save(false); });
})();
</script>

</body>
</html>
