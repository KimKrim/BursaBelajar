<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BursaBelajar — Platform Belajar Investasi & Keuangan</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#101f23">
<style>
:root{
  --bg-main:#0b1619;--bg-surface:#101f23;--bg-card:#152a2f;--bg-card-hover:#1d3a40;
  --border:#274347;--border-focus:#e3b23c;
  --text-main:#eaf1ee;--text-muted:#a2b8b3;--text-sub:#7f9994;
  --primary:#e3b23c;--primary-light:#f0c65a;--on-primary:#191303;
  --up:#3fcf8e;--up-bg:rgba(63,207,142,.13);--down:#f0685b;--down-bg:rgba(240,104,91,.14);
  --gold:#e3b23c;--purple:#a78bfa;--blue:#6aa5f7;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-sans:'Bricolage Grotesque',system-ui,sans-serif;
  --radius:6px;--hdr-h:64px;
}
[data-theme="light"]{
  --bg-main:#e7edea;--bg-surface:#f6f9f7;--bg-card:#ecf1ee;--bg-card-hover:#dce6e2;
  --border:#c2d0cb;--border-focus:#0f6a66;
  --text-main:#10221f;--text-muted:#3f5853;--text-sub:#647c77;
  --primary:#0f6a66;--primary-light:#0f6a66;--on-primary:#fff;
  --up:#0b8552;--up-bg:rgba(11,133,82,.12);--down:#c4352a;--down-bg:rgba(196,53,42,.11);
  --gold:#9a6a08;--purple:#6d4fd6;--blue:#1f5fc4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--hdr-h) + 48px)}
body{font-family:var(--font-sans);font-optical-sizing:auto;font-size:14px;background:var(--bg-main);color:var(--text-main);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit}
::selection{background:var(--primary);color:var(--on-primary)}
:focus-visible{outline:2px solid var(--primary-light);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
td,th,.v,.pill-up,.pill-down,#clock-txt{font-variant-numeric:tabular-nums}

/* Header */
header{position:sticky;top:0;z-index:1000;background:var(--bg-surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0)}
.header-wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:14px 20px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand-box{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-logo-img{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--bg-card)}
.brand-name{font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1.1}
.brand-slogan{font-size:11.5px;color:var(--text-muted);font-weight:500}
.brand-tag{border:1px solid var(--primary);color:var(--primary-light);background:transparent;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:8px;letter-spacing:.02em}
.clock-widget{display:flex;align-items:center;gap:12px;background:var(--bg-card);padding:5px 6px 5px 12px;border-radius:6px;border:1px solid var(--border);font-size:12px}
.clock-widget span{font-family:var(--font-mono);font-weight:500}
.speed-group{display:flex;align-items:center;overflow-x:auto;max-width:100%;border-radius:4px}
.speed-btn{background:transparent;border:1px solid var(--border);border-right-width:0;color:var(--text-muted);padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;border-radius:0}
.speed-btn:first-child{border-radius:4px 0 0 4px}
.speed-btn:last-child{border-radius:0 4px 4px 0;border-right-width:1px}
.speed-btn:hover{color:var(--text-main);background:var(--bg-card-hover)}
.speed-btn.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.header-stats{display:flex;gap:20px;align-items:center}
.h-stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.h-stat .l{font-size:11px;color:var(--text-sub)}
.h-stat .v{font-size:15px;font-weight:600;font-family:var(--font-mono)}
.kbd-btn kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sub);border:1px solid var(--border);border-radius:3px;padding:0 5px;background:var(--bg-surface)}

/* Navigasi */
nav{display:flex;overflow-x:auto;background:var(--bg-surface);border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:var(--hdr-h);z-index:900;scroll-snap-type:x proximity}
nav button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-weight:600;padding:12px 14px;cursor:pointer;white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:6px;scroll-snap-align:start;transition:color .15s}
nav button:hover{color:var(--text-main)}
nav button.active{color:var(--text-main);border-bottom-color:var(--primary)}

/* Pita bursa */
#tape{display:flex;overflow:hidden;background:var(--bg-main);border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12px;white-space:nowrap}
#tape .track{display:flex;flex:none;animation:tape 110s linear infinite}
#tape:hover .track,#tape:focus-within .track{animation-play-state:paused}
#tape button{background:none;border:none;border-right:1px dashed var(--border);color:var(--text-muted);padding:7px 16px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#tape button:hover{background:var(--bg-card)}
#tape b{color:var(--text-main);font-weight:600}
@keyframes tape{to{transform:translateX(-50%)}}

/* Konten */
main{max-width:1440px;margin:0 auto;padding:20px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0))}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px dashed var(--border);flex-wrap:wrap;gap:8px}
.card-head h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
.grid-main{display:grid;grid-template-columns:2.2fr 1fr;gap:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media(max-width:960px){.grid-main,.grid-2{grid-template-columns:1fr}}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.tag-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.tag-btn:hover{color:var(--text-main);background:var(--bg-card)}
.tag-btn.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
select,input,textarea{background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);padding:8px 11px;border-radius:4px;font-size:13px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--border-focus) 25%,transparent)}
::placeholder{color:var(--text-sub)}

/* Tabel */
.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{background:transparent;color:var(--text-sub);font-size:12px;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
th:hover{color:var(--text-main)}
td{padding:10px 12px;border-bottom:1px dotted var(--border);vertical-align:middle}
tr.market-row{transition:background .12s}
tr.market-row:hover{background:var(--bg-card);cursor:pointer;box-shadow:inset 3px 0 0 var(--primary)}

/* Lencana, tombol */
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700}
.badge-sehat{background:var(--up-bg);color:var(--up)}
.badge-naik{background:rgba(106,165,247,.16);color:var(--blue)}
.badge-waspada{background:rgba(227,178,60,.16);color:var(--gold)}
.badge-bangkrut{background:var(--down-bg);color:var(--down)}
.badge-ai-buy{background:var(--up-bg);color:var(--up);border:1px solid var(--up)}
.badge-ai-sell{background:var(--down-bg);color:var(--down);border:1px solid var(--down)}
.up{color:var(--up)}.down{color:var(--down)}
.pill-up,.pill-down{padding:2px 7px;border-radius:3px;font-weight:600;font-family:var(--font-mono)}
.pill-up{background:var(--up-bg);color:var(--up)}
.pill-down{background:var(--down-bg);color:var(--down)}
.btn{background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:7px 14px;border-radius:4px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .08s}
.btn:hover{background:var(--bg-card-hover)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-light);border-color:var(--primary-light)}
.btn-danger{background:var(--down);border-color:var(--down);color:#fff}
.btn-purple{background:var(--purple);border-color:var(--purple);color:#fff}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-danger:hover,.btn-purple:hover,.btn-blue:hover{background:var(--down);filter:brightness(1.1)}
.btn-purple:hover{background:var(--purple)}.btn-blue:hover{background:var(--blue)}
.star-btn{background:none;border:none;font-size:17px;cursor:pointer;color:var(--text-sub);padding:2px 6px;transition:transform .12s}
.star-btn:hover{transform:scale(1.2)}
.star-btn.fav{color:var(--gold)}
.chart-box{width:100%;height:280px;margin:12px 0;background:var(--bg-card);border-radius:4px;padding:8px;border:1px solid var(--border)}
svg.chart-svg{width:100%;height:100%;overflow:visible}
.progress-bar-wrap{background:var(--bg-card);height:8px;border-radius:2px;overflow:hidden;margin:8px 0;border:1px solid var(--border)}
.progress-bar-fill{background:var(--primary);height:100%;transition:width .4s ease}

/* Modal, toast, pencarian cepat */
.modal-overlay{position:fixed;inset:0;background:rgba(4,10,12,.72);display:none;justify-content:center;align-items:center;z-index:9999;backdrop-filter:blur(3px)}
.modal-box{background:var(--bg-surface);border:1px solid var(--border);border-top:3px solid var(--primary);border-radius:8px;padding:22px;width:90%;max-width:480px;max-height:90vh;overflow:auto}
.modal-overlay[style*="flex"] .modal-box{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0));right:20px;background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border);border-left:4px solid var(--primary);padding:11px 18px;border-radius:4px;font-weight:600;font-size:13px;z-index:10000;display:none;max-width:min(420px,calc(100vw - 40px));animation:toastin .22s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
#cmdk{position:fixed;inset:0;background:rgba(4,10,12,.72);z-index:10001;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;backdrop-filter:blur(3px)}
#cmdk[hidden]{display:none}
#cmdk .box{width:min(560px,92vw);background:var(--bg-surface);border:1px solid var(--border);border-top:3px solid var(--primary);border-radius:8px;overflow:hidden;animation:pop .16s ease-out}
#cmdk input{width:100%;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:15px 18px;font-size:15px;background:transparent;box-shadow:none}
#cmdk ul{list-style:none;max-height:50vh;overflow:auto;padding:6px}
#cmdk .grp{font-size:11.5px;color:var(--text-sub);padding:8px 12px 4px;font-weight:600}
#cmdk li[role=option]{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:4px;cursor:pointer;font-size:13.5px}
#cmdk li[aria-selected=true]{background:var(--bg-card-hover);box-shadow:inset 3px 0 0 var(--primary)}
#cmdk .k{font-family:var(--font-mono);font-weight:600;margin-right:10px}
#cmdk .hint{color:var(--text-sub);font-size:12px}
#cmdk .empty{padding:18px 12px;color:var(--text-muted)}

/* Responsif dan aksesibilitas */
@media(max-width:720px){
  header{position:relative}
  nav{top:0}
  .header-wrap{padding:10px 14px}
  .clock-widget{width:100%;flex-wrap:wrap;padding:6px 8px}
  .header-stats{width:100%;justify-content:space-between;gap:10px}
  .kbd-btn kbd{display:none}
  main{padding:12px}
  .card{padding:14px}
  #toast{left:12px;right:12px;max-width:none}
  #cmdk{padding-top:8vh}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #tape{overflow-x:auto}
}
</style>
</head>

<header>
  <div class="header-wrap">

        <button class="speed-btn active" onclick="setSpeed(1)">1x Normal</button>
        <button class="speed-btn" onclick="setSpeed(21600)">6 Jam/s</button>
        <button class="speed-btn" onclick="setSpeed(86400)">1 Hari/s</button>
        <button class="speed-btn" onclick="setSpeed(604800)">1 Mgg/s</button>
        <button class="speed-btn" onclick="setSpeed(2592000)">1 Bln/s</button>
      </div>
    </div>

    <!-- Quick Stats Bar -->
    <div class="header-stats">
      <div class="h-stat">

        <span class="v up" id="nw-txt">Rp0</span>

      <div class="h-stat">
        <span class="l">Kas IDR Siap Beli</span>

      </div>
      <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="toggleTheme()">🌓</button>
    </div>
  </div>
</header>

<nav id="nav-tabs"></nav>
<div id="tape" aria-label="Pita pergerakan harga aset"></div>
<main id="app-view"></main>

<!-- Modal Setup DCA -->
<div id="dca-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="card-head">
      <h2 id="dca-modal-title">Pasang Pembelian Rutin (DCA)</h2>
      <button class="btn" style="padding:2px 8px;" onclick="closeDCAModal()">✕</button>
    </div>
    <p style="font-size:12px; color:var(--text-sub); margin-bottom:12px;">
      Sistem memotong kas otomatis dan membelikan aset ini secara berkala, bahkan saat browser ditutup.
    </p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div>
        <label style="font-size:11px; color:var(--text-sub);">Nominal Beli Rutin (IDR)</label>
        <input id="modal-dca-amount" type="number" step="100000" min="100000" value="1000000" style="width:100%; margin-top:4px;">
      </div>
      <div>
        <label style="font-size:11px; color:var(--text-sub);">Frekuensi Auto-Debit</label>
        <select id="modal-dca-freq" style="width:100%; margin-top:4px;">
          <option value="7">Setiap 1 Minggu (7 Hari)</option>
          <option value="30">Setiap 1 Bulan (30 Hari)</option>
        </select>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
        <button class="btn" onclick="closeDCAModal()">Batal</button>
        <button class="btn btn-primary" onclick="confirmDCAModal()">Aktifkan Sekarang</button>
      </div>
    </div>
  </div>
</div>

<div id="cmdk" role="dialog" aria-modal="true" aria-label="Lompat cepat ke halaman atau aset" hidden>
  <div class="box"><input type="text" role="combobox" aria-expanded="true" aria-controls="cmdk-list" placeholder="Cari halaman, kode saham, atau nama aset" autocomplete="off"><ul id="cmdk-list" role="listbox"></ul></div>
</div>

<div id="toast">Notifikasi</div>

function randGaussian() {
  let u = 0, v = 0;
  while(u === 0) u = Math.random();
  while(v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function saveState() {
  if (!State) return;
  State.lastSavedDate = Date.now();
  if (Array.isArray(State.txHistory) && State.txHistory.length > 500) State.txHistory = State.txHistory.slice(0, 500);
  if (Array.isArray(State.newsFeed) && State.newsFeed.length > 50) State.newsFeed = State.newsFeed.slice(0, 50);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(State));
    localStorageWarningShown = false;
  } catch(e) {
    console.error("Gagal simpan data lokal", e);
    if (!localStorageWarningShown) {
      localStorageWarningShown = true;
      showToast("⚠️ Data belum tersimpan di perangkat. Penyimpanan browser penuh atau tidak tersedia; ekspor backup sekarang.");
    }
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) {
      State = JSON.parse(raw);
      if (!Array.isArray(State.newsFeed)) State.newsFeed = [];
      normalizeNewsFeed();
      MASTER_ASSETS.forEach(a => {
        if(!State.prices[a[0]]) {
          let price = 1.0;
          let history = [];
          for(let i = 0; i < 260; i++) { price *= (1 + randGaussian() * 0.015); history.push(price); }
          let scale = a[4] / history[history.length - 1];
          State.prices[a[0]] = history.map(v => Number((v * scale).toFixed(4)));
        }
        if(!State.companyStatus[a[0]]) State.companyStatus[a[0]] = 'sehat';
      });
      if(!State.watchlist) State.watchlist = ['BBCA','AAPL','BTC','XAU','EQIX'];
      if(!State.orders) State.orders = [];
      if(!State.autoInvestPlans) State.autoInvestPlans = [];
      if(!State.priceAlerts) State.priceAlerts = [];
      if(!State.trailingStops) State.trailingStops = [];
      if(!State.financialGoals) State.financialGoals = [];

      const now = Date.now();
      const timeOffline = now - (State.lastSavedDate || now);
      const daysOffline = Math.min(60, Math.floor(timeOffline / 86400000));

      if(daysOffline > 0) {
        for(let d = 0; d < daysOffline; d++) {
          State.currentDate += 86400000;
          stepSimulationDaily();
          evaluateAutoInvest();
        }
        showToast(`⚡ Selamat Datang! Memproses ${daysOffline} hari yang terlewat saat offline.`);
        addNews("Sinkronisasi Selesai", `Sistem mensimulasikan pasar & mengeksekusi DCA selama ${daysOffline} hari offline.`, true, 'pos');
      }
    } else {
      initFreshState();
    }
  } catch(e) {

function setupClockTicker() {
  lastWallClock = Date.now();
  if(masterTimer) clearInterval(masterTimer);

  masterTimer = setInterval(() => {
    const now = Date.now();
    const elapsedRealSec = (now - lastWallClock) / 1000;
    lastWallClock = now;

    if(simSpeedMultiplier > 0) {
      const addedSimSec = elapsedRealSec * simSpeedMultiplier;
      State.currentDate += (addedSimSec * 1000);
      dayAccumulator += addedSimSec;

      if(dayAccumulator >= 86400) {
        const steps = Math.floor(dayAccumulator / 86400);
        dayAccumulator %= 86400;
        for(let s = 0; s < Math.min(steps, 60); s++) {
          stepSimulationDaily();
        }
        saveState();
      }

      evaluateAutoInvest();
      evaluateAutomatedOrders();
      evaluatePriceAlerts();
      evaluateTrailingStops();
    }

    updateHeaderTime();
  }, 250);
}

function updateHeaderTime() {
  const d = new Date(State.currentDate);
  const dateStr = d.toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const timeStr = d.toISOString().substr(11, 8);

}

function setSpeed(mult) {

  document.querySelectorAll(".speed-btn").forEach((btn, idx) => {

function stepSimulationDaily() {
  const d = new Date(State.currentDate);
  const isWeekend = (d.getUTCDay() === 0 || d.getUTCDay() === 6);
  const marketJitter = randGaussian() * 0.005;

  rollPrices(isWeekend);

function evaluateAutoInvest() {
  if(!State.autoInvestPlans || !State.autoInvestPlans.length) return;

  State.autoInvestPlans.forEach(plan => {
    if(!plan.active) return;

    const ticker = plan.ticker;
    if (State.companyStatus[ticker] === 'bangkrut') {
      plan.active = false;
      plan.disabledReason = 'bangkrut';
      addNews(`Auto-Invest Dinonaktifkan: ${ticker}`, `Rencana pembelian rutin dihentikan karena aset berstatus bangkrut dan tidak lagi dapat dibeli.`, false, 'neg');
      showToast(`⛔ DCA ${ticker} dinonaktifkan: aset bangkrut.`);
      saveState();
      return;
    }

    if(State.currentDate >= plan.nextRunDate) {
      const item = ASSET_REGISTRY[ticker];
      if(!item) return;

      const isIDStock = (item[3] === 'ID' && item[2] === 's');
      const priceIDR = getAssetPriceIDR(ticker);

      let actualCost = 0;

      if(isIDStock) {
        const pricePerLot = priceIDR * 100;
        const lots = Math.floor(plan.amountIDR / (pricePerLot * 1.0015));
        if(lots >= 1) {
          unitsToBuy = lots * 100;
          actualCost = unitsToBuy * priceIDR * 1.0015;
        }
      } else {
        actualCost = plan.amountIDR;
        const netAfterFee = plan.amountIDR / 1.0015;
        unitsToBuy = netAfterFee / priceIDR;
      }

      if(unitsToBuy > 0 && State.cash >= actualCost) {
        State.cash -= actualCost;
        const pos = State.portfolio[ticker] || { qty: 0, avgPriceIDR: 0, totalInvested: 0 };
        pos.qty += unitsToBuy;
        pos.totalInvested += actualCost;
        pos.avgPriceIDR = pos.totalInvested / pos.qty;
        State.portfolio[ticker] = pos;

        State.txHistory.unshift({ date: State.currentDate, side: 'BUY (DCA)', ticker, qty: unitsToBuy, priceIDR, total: actualCost });

function evaluateTrailingStops() {
  if(!State.trailingStops || !State.trailingStops.length) return;
  State.trailingStops = State.trailingStops.filter(ts => {
    const pos = State.portfolio[ts.ticker];
    if (!pos || pos.qty <= 0) {
      addNews(`Trailing Stop Dibatalkan: ${ts.ticker}`, `Trailing stop dihapus karena posisi ${ts.ticker} sudah tidak dimiliki.`, false, 'neg');
      showToast(`⚠️ Trailing stop ${ts.ticker} dibatalkan: posisi sudah tidak ada.`);
      return false;
    }
    if (pos.qty + 1e-8 < ts.qty) {
      ts.qty = pos.qty;
      addNews(`Trailing Stop Disesuaikan: ${ts.ticker}`, `Jumlah trailing stop disesuaikan dengan sisa posisi menjadi ${pos.qty.toFixed(4)} unit.`, false, 'neutral');
      showToast(`ℹ️ Kuantitas trailing stop ${ts.ticker} disesuaikan dengan sisa posisi.`);
    }

    const curP = getAssetPriceIDR(ts.ticker);
    if(curP > ts.highestPriceSeen) {
      ts.highestPriceSeen = curP;
    }

    const stopPrice = ts.highestPriceSeen * (1 - (ts.trailingPct / 100));
    if(curP <= stopPrice) {
      const val = ts.qty * curP;
      const fee = val * 0.0025;
      const net = val - fee;
      State.cash += net;

      pos.totalInvested -= (pos.totalInvested * (ts.qty / pos.qty));
      pos.qty -= ts.qty;
      if(pos.qty < 0.00001) delete State.portfolio[ts.ticker];

      State.txHistory.unshift({ date: State.currentDate, side: 'TRAILING STOP SELL', ticker: ts.ticker, qty: ts.qty, priceIDR: curP, total: net });
      addNews(`Trailing Stop Dieksekusi: ${ts.ticker}`, `Berhasil mengamankan profit pada harga ${formatRupiah(curP)}. Total dana cair: ${formatRupiah(net)}.`, false, 'pos');
      showToast(`🛡️ Trailing Stop ${ts.ticker} Terealisasi!`);
      return false;
    }
    return true;
  });
}

/* =========================================================================
   4. MESIN AI CERDAS, MULTI-INDIKATOR KUANTITATIF & RISK/REWARD
   ========================================================================= */
function calculateRSI(slice, period = 14) {
  if(slice.length <= period) return 50;
  let gains = 0, losses = 0;
  for(let i = slice.length - period; i < slice.length; i++) {
    const diff = slice[i] - slice[i-1];
    if(diff >= 0) gains += diff;
    else losses -= diff;
  }
  if(losses === 0) return 100;
  const rs = (gains / period) / (losses / period);
  return 100 - (100 / (1 + rs));
}

function getSMA(slice, period = 20) {
  if(slice.length < period) return slice[slice.length - 1];
  let sum = 0;
  for(let i = slice.length - period; i < slice.length; i++) sum += slice[i];
  return sum / period;
}

function getEMASeries(slice, period = 9) {
  if (!slice || !slice.length) return [];
  const values = slice.map(Number);
  const out = new Array(values.length).fill(null);
  if (values.length < period) { out[values.length - 1] = values[values.length - 1]; return out; }
  const k = 2 / (period + 1);
  let seed = 0;
  for (let i = 0; i < period; i++) seed += values[i];
  let ema = seed / period;
  out[period - 1] = ema;
  for (let i = period; i < values.length; i++) {
    ema = values[i] * k + ema * (1 - k);
    out[i] = ema;
  }
  return out;
}

function getEMA(slice, period = 9) {
  if (!slice || !slice.length) return 0;
  const series = getEMASeries(slice, period);
  return series[series.length - 1] == null ? slice[slice.length - 1] : series[series.length - 1];
}

function getMACD(slice) {
  if (!slice || !slice.length) return { macd: 0, signal: 0, hist: 0 };
  const e12 = getEMASeries(slice, 12), e26 = getEMASeries(slice, 26);
  const start = Math.max(11, 25);
  const line = [];
  for (let i = start; i < slice.length; i++) {
    if (e12[i] != null && e26[i] != null) line.push(e12[i] - e26[i]);
  }
  if (!line.length) return { macd: 0, signal: 0, hist: 0 };
  const signalSeries = getEMASeries(line, 9);
  const macdLine = line[line.length - 1];
  const signal = signalSeries[signalSeries.length - 1] == null ? macdLine : signalSeries[signalSeries.length - 1];
  return { macd: macdLine, signal, hist: macdLine - signal };
}

function hasGoldenCross(slice) {
  if (!slice || slice.length < 201) return false;
  const end = slice.length;
  const sma50Now = getSMA(slice, 50), sma200Now = getSMA(slice, 200);
  const prev = slice.slice(0, end - 1);
  const sma50Prev = getSMA(prev, 50), sma200Prev = getSMA(prev, 200);
  return sma50Prev <= sma200Prev && sma50Now > sma200Now;
}

function getATR(slice, period = 14) {
  if(slice.length < period + 1) return slice[slice.length - 1] * 0.02;
  let trSum = 0;
  for(let i = slice.length - period; i < slice.length; i++) {
    trSum += Math.abs(slice[i] - slice[i-1]);
  }
  return trSum / period;
}

function getBollingerBands(slice, period = 20) {
  const sma = getSMA(slice, period);
  const recent = slice.slice(-period);
  const variance = recent.reduce((sum, val) => sum + Math.pow(val - sma, 2), 0) / period;
  const std = Math.sqrt(variance);
  return { upper: sma + (std * 2), lower: sma - (std * 2), sma };
}

function getSupportResistance(slice) {
  const recent = slice.slice(-60);
  const support = Math.min(...recent);
  const resistance = Math.max(...recent);
  return { support, resistance };
}

function hasWholeWord(text, word) {
  const escaped = String(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[^a-z0-9])' + escaped + '($|[^a-z0-9])', 'i').test(String(text || ''));
}

function runAIScreener() {
  const buyCandidates = [];
  const sellCandidates = [];

  MASTER_ASSETS.forEach(item => {
    const ticker = item[0];
    const hist = State.prices[ticker];
    const curP = hist[hist.length - 1];
    const st = State.companyStatus[ticker] || 'sehat';
    if(st === 'bangkrut') return;

    const rsi = calculateRSI(hist, 14);
    const sma20 = getSMA(hist, 20);
    const sma50 = getSMA(hist, 50);
    const ema9 = getEMA(hist, 9);
    const ema21 = getEMA(hist, 21);
    const macd = getMACD(hist);
    const atr = getATR(hist, 14);
    const bb = getBollingerBands(hist, 20);
    const sr = getSupportResistance(hist);
    const chg24h = getAssetChange(ticker);
    const boost = (State.macroBoosts[item[2]] || 0) + (State.macroBoosts[ticker] || 0);

    let score = 50;
    let reasons = [];

    if(rsi < 35) { score += 20; reasons.push(`RSI Oversold (${rsi.toFixed(1)}): Terdiskon sangat murah`); }
    if(macd.macd > macd.signal) { score += 15; reasons.push(`MACD Bullish: Garis MACD berada di atas signal line`); }
    if(ema9 > ema21) { score += 10; reasons.push(`Trend Cepat (EMA 9 > 21): Konfirmasi momentum naik`); }
    if(hasGoldenCross(hist)) { score += 15; reasons.push(`Golden Cross: SMA 50 memotong ke atas SMA 200`); }
    else if(sma50 > getSMA(hist, 200)) { score += 8; reasons.push(`Tren jangka panjang positif: SMA 50 di atas SMA 200`); }
    if(curP <= bb.lower * 1.01) { score += 15; reasons.push(`Pantulan Batas Bawah Bollinger Bands`); }
    if(boost > 0.01) { score += 15; reasons.push(`Katalis makro positif di sektor ${item[7].split('&')[0].trim()}`); }
    if(st === 'naik') { score += 20; reasons.push(`Status korporasi 'Naik Kelas' dengan ekspansi operasional`); }

    const fx = getFXRate(item[5]);
    const priceIDR = curP * fx;
    const targetPriceIDR = Math.max(priceIDR * 1.08, sr.resistance * fx);
    const stopLossPriceIDR = Math.max(priceIDR * 0.01, Math.min(priceIDR * 0.94, (curP - (atr * 1.5)) * fx));
    const potentialGain = ((targetPriceIDR - priceIDR) / priceIDR) * 100;
    const riskPct = ((priceIDR - stopLossPriceIDR) / priceIDR) * 100;
    const rrRatio = (potentialGain / (riskPct || 1)).toFixed(2);

    if(score >= 70) {
      buyCandidates.push({
        ticker, name: item[1], category: item[2], country: item[3],
        score, rsi, macdHist: macd.hist, reasons,
        priceIDR, targetPriceIDR, stopLossPriceIDR, rrRatio, chg24h
      });
    }
  });

  Object.keys(State.portfolio).forEach(ticker => {
    const pos = State.portfolio[ticker];
    const item = ASSET_REGISTRY[ticker];
    if(!item) return;
    const hist = State.prices[ticker];
    const curP = hist[hist.length - 1];
    const st = State.companyStatus[ticker] || 'sehat';
    const rsi = calculateRSI(hist, 14);
    const macd = getMACD(hist);
    const bb = getBollingerBands(hist, 20);
    const priceIDR = getAssetPriceIDR(ticker);
    const curVal = pos.qty * priceIDR;
    const pnlPct = (curVal - pos.totalInvested) / (pos.totalInvested || 1);
    const boost = (State.macroBoosts[item[2]] || 0) + (State.macroBoosts[ticker] || 0);

    let score = 50;
    let reasons = [];

    if(st === 'waspada') { score += 35; reasons.push(`BAHAYA: Status korporasi masuk radar Waspada (Utang melonjak)`); }
    if(st === 'bangkrut') { score += 50; reasons.push(`DARURAT: Emiten bangkrut/pailit! Amankan modal secepatnya`); }
    if(pnlPct >= 0.25) { score += 25; reasons.push(`Take Profit Institusional: Keuntungan telah mencapai +${(pnlPct*100).toFixed(1)}%`); }
    if(rsi > 72) { score += 20; reasons.push(`RSI Overbought (${rsi.toFixed(1)}): Rentan koreksi pembalikan arah`); }
    if(macd.macd < macd.signal) { score += 15; reasons.push(`MACD Bearish: Garis MACD berada di bawah signal line`); }
    if(curP >= bb.upper * 0.99) { score += 15; reasons.push(`Menembus batas atas Bollinger Bands (Jenuh beli)`); }
    if(boost < -0.015) { score += 15; reasons.push(`Sentimen sektor tertekan pelemahan makroekonomi`); }

    if(score >= 68) {
      sellCandidates.push({ ticker, name: item[1], qty: pos.qty, pnlPct, score, reasons, priceIDR, curVal });
    }
  });

  buyCandidates.sort((a,b) => b.score - a.score);
  sellCandidates.sort((a,b) => b.score - a.score);

  return { buyCandidates, sellCandidates };
}

const missingFXWarnings = new Set();
function getFXRate(currency) {
  const rate = FX_RATES[currency];
  if (Number.isFinite(rate) && rate > 0) return rate;
  if (!missingFXWarnings.has(currency)) {
    missingFXWarnings.add(currency);
    console.error(`Kurs simulator tidak tersedia untuk mata uang: ${currency}`);
    if (typeof showToast === 'function') showToast(`⚠️ Kurs ${currency} belum tersedia; nilai aset tidak dihitung sebagai IDR 1:1.`);
  }
  return 0;
}

function getAssetPriceIDR(ticker) {
  const asset = ASSET_REGISTRY[ticker];
  if(!asset) return 0;
  const hist = State.prices[ticker];
  if (!Array.isArray(hist) || !hist.length) return 0;
  const lastRaw = hist[hist.length - 1];
  const rate = getFXRate(asset[5]);
  return lastRaw * rate;
}

function getAssetChange(ticker) {
  const hist = State.prices[ticker];
  if(!hist || hist.length < 2) return 0;
  const cur = hist[hist.length - 1];
  const prev = hist[hist.length - 2] || cur;
  return (cur - prev) / prev;
}

function getTotalDebt() {
  return State.loans.reduce((acc, l) => acc + (l.installment * (l.totalMonths - l.paidMonths)) + (l.penalty || 0), 0);
}

function getNetWorth() {
  let portVal = 0;
  for(let t in State.portfolio) {
    portVal += (State.portfolio[t].qty * getAssetPriceIDR(t));
  }
  return State.cash + portVal - getTotalDebt();
}

function formatRupiah(val) {
  const s = val < 0 ? "-" : "";
  return s + "Rp " + Math.abs(Math.round(val)).toLocaleString("id-ID");
}

function formatPercent(pct) {
  const s = pct >= 0 ? "+" : "";
  return s + (pct * 100).toFixed(2) + "%";
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function showToast(msg) {

/* GRAFIK TRADINGVIEW STYLE: LINE + CANDLESTICK + BOLLINGER BANDS */
function generateTechnicalChart(hist, days) {
  const slice = hist.slice(-days);
  const min = Math.min(...slice);
  const max = Math.max(...slice);
  const range = (max - min) || 1;
  const W = 680;
  const H = 260;
  const pad = 16;

  const bbUpperPoints = [];
  const bbLowerPoints = [];
  for(let i = 0; i < slice.length; i++) {
    if(i >= 19) {
      const sub = slice.slice(0, i + 1);
      const bb = getBollingerBands(sub, 20);
      const x = (i / (slice.length - 1)) * W;
      const yUp = H - pad - ((bb.upper - min) / range) * (H - pad * 2);
      const yLow = H - pad - ((bb.lower - min) / range) * (H - pad * 2);
      bbUpperPoints.push(`${x.toFixed(1)},${yUp.toFixed(1)}`);
      bbLowerPoints.push(`${x.toFixed(1)},${yLow.toFixed(1)}`);
    }
  }

  const isBull = slice[slice.length - 1] >= slice[0];
  const strokeColor = isBull ? "var(--up)" : "var(--down)";

  if(chartDisplayMode === "candle") {
    const candleWidth = Math.max(2, (W / slice.length) * 0.65);
    const candles = slice.map((val, idx) => {
      const prev = slice[idx - 1] || val;
      const open = prev;
      const close = val;
      const wickPct = Math.min(0.02, Math.max(0.001, Math.abs(close - open) / (Math.abs(open) || 1) * 0.35));
      const high = Math.max(open, close) * (1 + wickPct);
      const low = Math.min(open, close) * (1 - wickPct);

      const x = (idx / (slice.length - 1)) * W;
      const yOpen = H - pad - ((open - min) / range) * (H - pad * 2);
      const yClose = H - pad - ((close - min) / range) * (H - pad * 2);
      const yHigh = H - pad - ((high - min) / range) * (H - pad * 2);
      const yLow = H - pad - ((low - min) / range) * (H - pad * 2);

      const isCGreen = close >= open;
      const color = isCGreen ? "var(--up)" : "var(--down)";
      const topY = Math.min(yOpen, yClose);
      const bodyH = Math.max(2, Math.abs(yClose - yOpen));

      return `
        <line x1="${x.toFixed(1)}" y1="${yHigh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yLow.toFixed(1)}" stroke="${color}" stroke-width="1"/>
        <rect x="${(x - candleWidth/2).toFixed(1)}" y="${topY.toFixed(1)}" width="${candleWidth.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${color}"/>
      `;
    }).join("");

    return `
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${bbUpperPoints.length ? `<polyline points="${bbUpperPoints.join(' ')}" fill="none" stroke="rgba(59,130,246,0.35)" stroke-width="1.2" stroke-dasharray="3"/>` : ''}
        ${bbLowerPoints.length ? `<polyline points="${bbLowerPoints.join(' ')}" fill="none" stroke="rgba(59,130,246,0.35)" stroke-width="1.2" stroke-dasharray="3"/>` : ''}
        ${candles}
      </svg>
    `;
  }

  const smaPoints = [];
  for(let i = 0; i < slice.length; i++) {
    if(i >= 19) {
      let sum = 0;
      for(let j = 0; j < 20; j++) sum += slice[i - j];
      const smaVal = sum / 20;
      const x = (i / (slice.length - 1)) * W;
      const y = H - pad - ((smaVal - min) / range) * (H - pad * 2);
      smaPoints.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
  }

  const pricePoints = slice.map((val, idx) => {
    const x = (idx / (slice.length - 1)) * W;
    const y = H - pad - ((val - min) / range) * (H - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");

  return `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <polygon points="0,${H} ${pricePoints} ${W},${H}" fill="url(#areaGrad)"/>
      <polyline points="${pricePoints}" fill="none" stroke="${strokeColor}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      ${smaPoints.length ? `<polyline points="${smaPoints.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4" vector-effect="non-scaling-stroke"/>` : ''}
      ${bbUpperPoints.length ? `<polyline points="${bbUpperPoints.join(' ')}" fill="none" stroke="rgba(59,130,246,0.4)" stroke-width="1.2" stroke-dasharray="2"/>` : ''}
      ${bbLowerPoints.length ? `<polyline points="${bbLowerPoints.join(' ')}" fill="none" stroke="rgba(59,130,246,0.4)" stroke-width="1.2" stroke-dasharray="2"/>` : ''}
    </svg>
  `;
}

function getAssetSector(asset) {
  const type = asset[2];
  const desc = `${asset[1] || ''} ${asset[7] || ''}`.toLowerCase();
  if (type === 'c') return 'Kripto';
  if (type === 'k') return 'Komoditas';
  if (type === 'r') return 'Reksadana';
  if (type === 'e') {
    if (/obligasi|bond|treasury|fixed income|surat utang/.test(desc)) return 'Obligasi & Pendapatan Tetap';
    if (/technology|teknologi|chip|semiconductor|semikonduktor|robot|cybersecurity|cyber security|artificial intelligence|\bai\b/.test(desc)) return 'Teknologi';
    if (/financial|finansial|bank|financial select|payment|pembayaran|dividend|dividen/.test(desc)) return 'Finansial & Dividen';
    if (/energy|energi|minyak|gas|solar|clean energy|uranium/.test(desc)) return 'Energi';
    if (/health|biotech|biotek|farmasi|medical|medis/.test(desc)) return 'Kesehatan';
    if (/real estate|property|properti|reit/.test(desc)) return 'Properti';
    if (/gold|emas|silver|perak|copper|tembaga|agriculture|pertanian|commodity|komoditas/.test(desc)) return 'Komoditas';
    return 'ETF & Indeks';
  }
  if (/logistik|kapal|pelayaran|kargo|shipping|freight|kontainer|ekspedisi/.test(desc)) return 'Logistik & Pelayaran';
  if (/data center|real estat|properti|reit|menara telekomunikasi|jalan tol/.test(desc)) return 'Infrastruktur & Properti';
  if (/bank|fintech|asuransi|finansial|pembayaran|kredit|lending|investasi|sekuritas/.test(desc)) return 'Finansial';
  if (/farmasi|kesehatan|medis|biotek|health|obat|nutrisi medis/.test(desc)) return 'Kesehatan';
  if (/chip|semikonduktor|software|perangkat lunak|cloud|komputasi|teknologi|teknologi|cybersecurity|cyber security|internet|digital|ai | ai$|robotika|otomasi|database|server|jaringan 5g/.test(desc)) return 'Teknologi';
  if (/energi|minyak|gas bumi|batubara|batu bara|listrik|geotermal|solar|turbin angin/.test(desc)) return 'Energi';
  if (/tambang|mineral|nikel|tembaga|emas|bauksit|semen|material|petrokimia/.test(desc)) return 'Material & Pertambangan';
  if (/ritel|konsumen|makanan|minuman|fmcg|fesyen|restoran|e-commerce|marketplace|wisata|hiburan|perawatan pribadi/.test(desc)) return 'Konsumen';
  if (/telekomunikasi|telekom|jaringan seluler|operator telekom/.test(desc)) return 'Telekomunikasi';
  if (/otomotif|mobil|pesawat|aviasi|alat berat|konstruksi|manufaktur|pabrik|kereta/.test(desc)) return 'Industri & Transportasi';
  return type === 's' ? 'Saham Lainnya' : 'Aset Lainnya';
}

function recalcOrderTotal() {
  const item = ASSET_REGISTRY[activeTicker];
  const isIDStock = (item[3] === 'ID' && item[2] === 's');
  const inputVal = parseFloat(document.getElementById("order-qty").value) || 0;
  const actualQty = isIDStock ? (inputVal * 100) : inputVal;
  const priceIDR = getAssetPriceIDR(activeTicker);
  const total = actualQty * priceIDR;

  document.getElementById("ord-total-est").textContent = formatRupiah(total);
  document.getElementById("ord-fee-est").textContent = formatRupiah(total * 0.0015);
}

function reconcileOrdersAfterSale(ticker) {
  const pos = State.portfolio[ticker];
  let cancelled = 0, adjusted = 0;
  State.orders = (State.orders || []).filter(o => {
    if (o.ticker !== ticker) return true;
    if (!pos || pos.qty <= 0.00001) { cancelled++; return false; }
    if (o.qty > pos.qty) { o.qty = pos.qty; adjusted++; }
    return o.qty > 0;
  });
  State.trailingStops = (State.trailingStops || []).filter(o => {
    if (o.ticker !== ticker) return true;
    if (!pos || pos.qty <= 0.00001) { cancelled++; return false; }
    if (o.qty > pos.qty) { o.qty = pos.qty; adjusted++; }
    return o.qty > 0;
  });
  if (cancelled || adjusted) {
    const message = `${cancelled} order proteksi dibatalkan dan ${adjusted} disesuaikan untuk ${ticker} setelah penjualan manual.`;
    addNews(`Penyesuaian Order Proteksi: ${ticker}`, message, false, 'neutral');
    showToast(`ℹ️ Order ${ticker}: ${cancelled} dibatalkan, ${adjusted} disesuaikan.`);
  }
}

function submitOrder(side) {
  const item = ASSET_REGISTRY[activeTicker];
  const isIDStock = (item[3] === 'ID' && item[2] === 's');
  const inputVal = parseFloat(document.getElementById("order-qty").value);
  if(!inputVal || inputVal <= 0) return showToast("⚠️ Masukkan nominal unit transaksi yang benar!");

  const actualUnits = isIDStock ? (inputVal * 100) : inputVal;
  const priceIDR = getAssetPriceIDR(activeTicker);
  const totalVal = actualUnits * priceIDR;
  const pos = State.portfolio[activeTicker] || { qty: 0, avgPriceIDR: 0, totalInvested: 0 };
  const st = State.companyStatus[activeTicker] || 'sehat';

  if(side === 'BUY') {
    if(st === 'bangkrut') return showToast("❌ Perusahaan bangkrut/pailit tidak dapat dibeli lagi.");
    const fee = totalVal * 0.0015;
    const grossCost = totalVal + fee;
    if(grossCost > State.cash) return showToast("❌ Saldo kas IDR tidak mencukupi!");

    State.cash -= grossCost;
    pos.qty += actualUnits;
    pos.totalInvested += grossCost;
    pos.avgPriceIDR = pos.totalInvested / pos.qty;
    State.portfolio[activeTicker] = pos;

    State.txHistory.unshift({ date: State.currentDate, side: 'BUY', ticker: activeTicker, qty: actualUnits, priceIDR, total: grossCost });
    showToast(`✅ Berhasil membeli ${actualUnits} unit ${activeTicker}`);
  } else {
    if(actualUnits > (pos.qty + 0.0001)) return showToast("❌ Jumlah penjualan melebihi unit yang Anda miliki!");
    const fee = totalVal * 0.0025;
    const netProceeds = totalVal - fee;
    State.cash += netProceeds;

    pos.totalInvested -= (pos.totalInvested * (actualUnits / pos.qty));
    pos.qty -= actualUnits;
    if(pos.qty < 0.00001) delete State.portfolio[activeTicker];
    else pos.avgPriceIDR = pos.totalInvested / pos.qty;

    State.txHistory.unshift({ date: State.currentDate, side: 'SELL', ticker: activeTicker, qty: actualUnits, priceIDR, total: netProceeds });
    reconcileOrdersAfterSale(activeTicker);
    showToast(`✅ Berhasil menjual ${actualUnits} unit ${activeTicker}`);
  }

  saveState();
  renderCurrentTab();
}

function addAutoOrder() {

function applyMacroShock(scenario) {
  let shocks = {};
  let title = "";

  if(scenario === 'WAR_ENERGY') {
    title = "Krisis Energi Selat Hormuz";
    shocks = { BRENT: 0.18, WTI: 0.17, XAU: 0.08, XAG: 0.06, s: -0.06, c: -0.08, MAERSK: 0.14, ZIM: 0.18 };
  } else if(scenario === 'TECH_CRASH') {
    title = "Koreksi Ekstrem Sektor AI & Data Center";
    shocks = { NVDA: -0.18, 2330: -0.15, QQQ: -0.12, AAPL: -0.10, SMCI: -0.22, EQIX: -0.12, r: 0.01 };
  } else if(scenario === 'RATE_CUT') {
    title = "Pelonggaran Moneter Global";
    shocks = { s: 0.10, e: 0.08, c: 0.20, XAU: 0.05, GOTO: 0.22, BUKA: 0.18 };
  } else if(scenario === 'CRYPTO_WINTER') {
    title = "Crypto Winter Flash Crash";
    shocks = { c: -0.35, XAU: 0.04, BBCA: 0.02, KO: 0.02 };
  }

  let affected = 0;
  MASTER_ASSETS.forEach(asset => {
    const ticker = asset[0];
    const shock = Object.prototype.hasOwnProperty.call(shocks, ticker) ? shocks[ticker] : (shocks[asset[2]] || 0);
    const history = State.prices[ticker];
    if (!shock || !Array.isArray(history) || !history.length) return;
    const last = history.length - 1;
    history[last] = Math.max(0.000001, Number((history[last] * Math.max(0.01, 1 + shock)).toFixed(6)));
    affected++;
  });

  addNews(`Skenario Stress-Test: ${title}`, `Perubahan instan diterapkan ke harga simulasi pada ${affected} aset. Dampak ini tidak ditambahkan ulang setiap hari.`, false, 'geo');
  saveState();
  showToast(`💥 ${title}: harga ${affected} aset langsung diperbarui.`);
  renderCurrentTab();
}

function calculatePortfolioBeta() {
  const benchmark = State.prices.SPY;
  if (!Array.isArray(benchmark) || benchmark.length < 3) return 1;
  const marketReturns = [];
  const count = Math.min(61, benchmark.length);
  for (let i = benchmark.length - count + 1; i < benchmark.length; i++) marketReturns.push(benchmark[i] / benchmark[i - 1] - 1);
  const meanM = marketReturns.reduce((a,b) => a + b, 0) / marketReturns.length;
  const variance = marketReturns.reduce((a,r) => a + (r - meanM) ** 2, 0) / marketReturns.length;
  if (!Number.isFinite(variance) || variance <= 0) return 1;
  let portfolioValue = 0;
  const positions = Object.entries(State.portfolio).map(([ticker, pos]) => {
    const value = (pos.qty || 0) * getAssetPriceIDR(ticker); portfolioValue += value; return { ticker, value };
  });
  if (portfolioValue <= 0) return 1;
  let weightedBeta = 0;
  positions.forEach(({ticker, value}) => {
    const hist = State.prices[ticker];
    if (!Array.isArray(hist) || hist.length < 3 || value <= 0) return;
    const n = Math.min(61, hist.length, benchmark.length);
    const assetReturns = [], market = [];
    for (let i = 1; i < n; i++) {
      const ai = hist[hist.length - n + i], ap = hist[hist.length - n + i - 1];
      const mi = benchmark[benchmark.length - n + i], mp = benchmark[benchmark.length - n + i - 1];
      if (ap > 0 && mp > 0) { assetReturns.push(ai / ap - 1); market.push(mi / mp - 1); }
    }
    if (assetReturns.length < 3) return;
    const meanA = assetReturns.reduce((a,b) => a + b, 0) / assetReturns.length;
    const meanBench = market.reduce((a,b) => a + b, 0) / market.length;
    let cov = 0, varM = 0;
    for (let i = 0; i < market.length; i++) { cov += (assetReturns[i] - meanA) * (market[i] - meanBench); varM += (market[i] - meanBench) ** 2; }
    const beta = varM > 0 ? cov / varM : 1;
    weightedBeta += (value / portfolioValue) * (Number.isFinite(beta) ? beta : 1);
  });
  return Number.isFinite(weightedBeta) ? weightedBeta : 1;
}

function sendAIChatQuery() {
  const risk = document.getElementById("chat-risk").value;
  const q = document.getElementById("chat-prompt").value.trim().toLowerCase();
  const box = document.getElementById("ai-chat-box");
  const head = document.getElementById("ai-chat-header");
  const resp = document.getElementById("ai-chat-response");

  const { buyCandidates, sellCandidates } = runAIScreener();
  let text = "";

  const qTokens = new Set(q.split(/[^a-z0-9.]+/i).filter(Boolean));
  const genericNameWords = new Set(['inc','corp','corporation','company','co','the','group','holdings','holding','plc','ltd','limited','international','and','sa','ag','se','bank','global']);
  const matchedAssets = MASTER_ASSETS.filter(a => {
    const tickerMatch = hasWholeWord(q, a[0]);
    const fullNameMatch = q.includes(String(a[1]).toLowerCase());
    const nameTokens = String(a[1]).toLowerCase().split(/[^a-z0-9]+/i).filter(w => w.length >= 3 && !genericNameWords.has(w));
    const distinctNameMatch = nameTokens.some(w => qTokens.has(w));
    return tickerMatch || fullNameMatch || distinctNameMatch;
  });
  const matchedTicker = matchedAssets.length === 1 ? matchedAssets[0][0] : null;

  if(matchedTicker) {
    const item = ASSET_REGISTRY[matchedTicker];
    const hist = State.prices[matchedTicker];
    const curP = hist[hist.length - 1];
    const fx = getFXRate(item[5]);
    const priceIDR = curP * fx;
    const rsi = calculateRSI(hist, 14);
    const macd = getMACD(hist);
    const ema9 = getEMA(hist, 9);
    const ema21 = getEMA(hist, 21);
    const sr = getSupportResistance(hist);
    const st = State.companyStatus[matchedTicker] || 'sehat';
    const chg = getAssetChange(matchedTicker);

    const trend = ema9 > ema21 ? "BULLISH (Uptrend)" : "BEARISH (Downtrend)";
    const rsiCond = rsi > 70 ? "Overbought (Jenuh Beli)" : rsi < 30 ? "Oversold (Terdiskon Murah)" : "Netral";
    const atr = getATR(hist, 14);
    const tpIDR = Math.max(priceIDR * 1.08, sr.resistance * fx);
    const slIDR = Math.max(priceIDR * 0.01, Math.min(priceIDR * 0.94, (curP - atr * 1.5) * fx));

    text = `🔍 Laporan Analitik Kuantitatif AI untuk ${item[1]} (${matchedTicker}):\n` +
      `• Harga Terkini: ${formatRupiah(priceIDR)} (${formatPercent(chg)})\n` +

      `• Tren Momentum: ${trend} (EMA 9 vs 21)\n` +
      `• Indikator RSI(14): ${rsi.toFixed(1)} [${rsiCond}]\n` +
      `• Posisi MACD: ${macd.macd > macd.signal ? 'di atas signal line (bullish)' : 'di bawah signal line (bearish)'}\n` +
      `• Level Teknis: Support ${formatRupiah(sr.support * fx)} | Resistance ${formatRupiah(sr.resistance * fx)}\n` +
      `• Target/SL heuristik simulator: TP ${formatRupiah(tpIDR)} | SL ${formatRupiah(slIDR)} (bukan prediksi harga)\n\n` +
      `Saran Strategi: ${rsi < 38 ? 'Area akumulasi menarik untuk cicil beli (DCA).' : rsi > 68 ? 'Sebaiknya amankan profit atau pasang Trailing Stop.' : 'Tren berada di konsolidasi wajar, pantau resistance.'}`;
  } else if(matchedAssets.length > 1) {
    text = `Saya menemukan beberapa instrumen yang mungkin dimaksud: ${matchedAssets.slice(0, 8).map(a => `${a[0]} (${a[1]})`).join(', ')}.
Tulis ticker atau nama yang lebih spesifik agar analisis tidak salah aset.`;
  } else if(q.includes("audit") || q.includes("portofolio") || q.includes("evaluasi")) {

      `• Jumlah Posisi Aktif: ${heldCount} instrumen\n`;

    } else {

    }
  } else if(q.includes("data center") || q.includes("server") || q.includes("cloud")) {
    text = `🏢 Analisis AI Sektor Data Center & AI Cloud:\n` +
      `Sektor data center (EQIX, DLR, SMCI, VRT, ANET) mengalami pertumbuhan pesat didorong komputasi model AI generatif.\n` +

function setupCalcListeners() {
  const calc1 = () => {
    const P = parseFloat(document.getElementById("c-p0").value) || 0;
    const PMT = parseFloat(document.getElementById("c-pmt").value) || 0;
    const r = (parseFloat(document.getElementById("c-r").value) || 0) / 100 / 12;
    const n = (parseFloat(document.getElementById("c-yr").value) || 0) * 12;

    let fv = P * Math.pow(1 + r, n);
    if(r > 0) fv += PMT * ((Math.pow(1 + r, n) - 1) / r);
    else fv += PMT * n;

    const totalIn = P + (PMT * n);
    document.getElementById("res-fv").textContent = formatRupiah(fv);
    document.getElementById("res-principal").textContent = formatRupiah(totalIn);
  };

  const calcFX = () => {
    const amt = parseFloat(document.getElementById("fx-amt").value) || 0;
    const from = document.getElementById("fx-from").value;
    const to = document.getElementById("fx-to").value;

    const fromRate = getFXRate(from), toRate = getFXRate(to);
    if (!fromRate || !toRate) { document.getElementById('fx-res').textContent = 'Kurs belum tersedia'; return; }
    const inIDR = amt * fromRate;
    const result = inIDR / toRate;

    document.getElementById("fx-res").textContent = to === 'IDR' ? formatRupiah(result) : `${result.toLocaleString(undefined, {maximumFractionDigits: 2})} ${to}`;
  };

  ["c-p0","c-pmt","c-r","c-yr"].forEach(id => document.getElementById(id).addEventListener("input", calc1));
  ["fx-amt","fx-from","fx-to"].forEach(id => document.getElementById(id).addEventListener("input", calcFX));

  calc1();
  calcFX();
}

function validateBackupState(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
  const plainObject = v => !!v && typeof v === 'object' && !Array.isArray(v);
  if (!plainObject(data.portfolio) || !plainObject(data.prices)) return false;
  if (!Number.isFinite(data.cash) || data.cash < 0 || !Number.isFinite(data.initialCapital) || data.initialCapital <= 0) return false;
  for (const key of ['companyStatus','macroBoosts']) if (data[key] != null && !plainObject(data[key])) return false;
  if (data.creditScore != null && (!Number.isFinite(data.creditScore) || data.creditScore < 0)) return false;
  if (data.dripEnabled != null && typeof data.dripEnabled !== 'boolean') return false;
  if (data.currentDate != null && !Number.isFinite(data.currentDate)) return false;
  if (data.lastSavedDate != null && !Number.isFinite(data.lastSavedDate)) return false;
  const known = new Set(MASTER_ASSETS.map(a => a[0]));
  for (const [ticker, hist] of Object.entries(data.prices)) {
    if (!known.has(ticker) || !Array.isArray(hist) || hist.length < 2 || hist.length > 2000 || hist.some(v => !Number.isFinite(v) || v <= 0)) return false;
  }
  for (const [ticker, pos] of Object.entries(data.portfolio)) {
    if (!known.has(ticker) || !plainObject(pos) || !Number.isFinite(pos.qty) || pos.qty <= 0 || !Number.isFinite(pos.totalInvested) || pos.totalInvested < 0) return false;
    if (pos.avgPriceIDR != null && (!Number.isFinite(pos.avgPriceIDR) || pos.avgPriceIDR < 0)) return false;
  }
  if (data.companyStatus) {
    for (const [ticker, status] of Object.entries(data.companyStatus)) {
      if (!known.has(ticker) || !['sehat','naik','waspada','bangkrut'].includes(status)) return false;
    }
  }
  if (data.macroBoosts) {
    for (const [key, value] of Object.entries(data.macroBoosts)) {
      if (!Number.isFinite(value)) return false;
    }
  }
  const arrayKeys = ['loans','watchlist','orders','autoInvestPlans','priceAlerts','trailingStops','financialGoals','txHistory','newsFeed'];
  for (const key of arrayKeys) if (data[key] != null && !Array.isArray(data[key])) return false;
  if (data.watchlist && data.watchlist.some(t => typeof t !== 'string' || !known.has(t))) return false;
  if (data.orders && data.orders.some(o => !plainObject(o) || !known.has(o.ticker) || !['TP','SL'].includes(o.type) || !Number.isFinite(o.targetPrice) || o.targetPrice <= 0 || !Number.isFinite(o.qty) || o.qty <= 0)) return false;
  if (data.autoInvestPlans && data.autoInvestPlans.some(o => !plainObject(o) || !known.has(o.ticker) || !Number.isFinite(o.amountIDR) || o.amountIDR <= 0 || !Number.isFinite(o.frequencyDays) || o.frequencyDays <= 0 || !Number.isFinite(o.nextRunDate) || typeof o.active !== 'boolean')) return false;
  if (data.priceAlerts && data.priceAlerts.some(o => !plainObject(o) || !known.has(o.ticker) || !['ABOVE','BELOW'].includes(o.condition) || !Number.isFinite(o.targetPrice) || o.targetPrice <= 0 || typeof o.active !== 'boolean')) return false;
  if (data.trailingStops && data.trailingStops.some(o => !plainObject(o) || !known.has(o.ticker) || !Number.isFinite(o.trailingPct) || o.trailingPct <= 0 || !Number.isFinite(o.highestPriceSeen) || o.highestPriceSeen <= 0 || !Number.isFinite(o.qty) || o.qty <= 0)) return false;
  if (data.loans && data.loans.some(o => !plainObject(o) || typeof o.name !== 'string' || !Number.isFinite(o.principal) || o.principal < 0 || !Number.isFinite(o.totalMonths) || o.totalMonths <= 0 || !Number.isFinite(o.installment) || o.installment < 0 || !Number.isFinite(o.paidMonths) || o.paidMonths < 0 || !Number.isFinite(o.nextDue))) return false;
  if (data.financialGoals && data.financialGoals.some(o => !plainObject(o) || typeof o.title !== 'string' || !Number.isFinite(o.targetAmount) || o.targetAmount <= 0)) return false;
  if (data.txHistory && data.txHistory.some(o => !plainObject(o))) return false;
  if (data.newsFeed && data.newsFeed.some(o => !plainObject(o))) return false;
  return true;
}

function importDataBackup(event) {
  const file = event.target.files[0];
  if(!file) return;
  if (file.size > 10 * 1024 * 1024) { showToast('❌ File backup terlalu besar (maksimal 10 MB).'); event.target.value = ''; return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && typeof imported === 'object' && !Array.isArray(imported)) {
        const defaults = { currentDate: Date.now(), lastSavedDate: Date.now(), companyStatus: {}, macroBoosts: {}, loans: [], creditScore: 680, watchlist: [], orders: [], autoInvestPlans: [], priceAlerts: [], trailingStops: [], dripEnabled: false, financialGoals: [], txHistory: [], newsFeed: [] };
        Object.keys(defaults).forEach(key => { if (imported[key] == null) imported[key] = defaults[key]; });
      }
      if (validateBackupState(imported)) {
        State = imported;
        if (!Array.isArray(State.txHistory)) State.txHistory = [];
        State.txHistory = State.txHistory.slice(0, 500);
        if (!Array.isArray(State.newsFeed)) State.newsFeed = [];
        normalizeNewsFeed();
        MASTER_ASSETS.forEach(a => {
          if (!Array.isArray(State.prices[a[0]])) State.prices[a[0]] = genHistory(a);
          if (!State.companyStatus || !State.companyStatus[a[0]]) { State.companyStatus = State.companyStatus || {}; State.companyStatus[a[0]] = 'sehat'; }
        });
        saveState();
        showToast('✅ Berhasil memulihkan data dari file backup yang valid!');
        renderCurrentTab();
      } else {
        showToast('❌ Format backup tidak valid atau berisi data/tipe aset yang tidak dikenal. Data saat ini tidak diubah.');
      }
    } catch(err) {
      console.error('Backup gagal divalidasi', err);
      showToast('❌ Gagal membaca file backup; data saat ini tidak diubah.');
    } finally { event.target.value = ''; }
  };
  reader.readAsText(file);
}

function hardResetSimulation() {
  if(confirm("Apakah Anda yakin ingin mereset seluruh data simulasi dan mulai ulang dari saldo Rp 50 Juta?")) {
    localStorage.removeItem(STORAGE_KEY);

  }
}

    ul.innerHTML = '';
    if (!opts.length) { ul.innerHTML = '<li class="empty">Tidak ada halaman atau aset yang cocok.</li>'; return; }
    let last = '';
    opts.forEach((o, i) => {
      if (o.g !== last) { last = o.g; const g = document.createElement('li'); g.className = 'grp'; g.textContent = o.g; g.setAttribute('role', 'presentation'); ul.appendChild(g); }

      if (o.k) { const k = document.createElement('span'); k.className = 'k'; k.textContent = o.k; li.firstChild.textContent = ''; li.firstChild.append(k, o.t); }
      li.onclick = () => run(i); ul.appendChild(li);
    });
    inp.setAttribute('aria-activedescendant', 'cmdk-' + sel);
    const cur = $('#cmdk-' + sel); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

    q = q.trim().toLowerCase(); sel = 0;
    const pages = TABS.filter(t => t[1].toLowerCase().includes(q)).map(t => ({ g: 'Halaman', t: t[1], f: () => switchView(t[0]) }));
    const assets = q ? MASTER_ASSETS.filter(a => a[0].toLowerCase().includes(q) || a[1].toLowerCase().includes(q)).slice(0, 8).map(a => ({ g: 'Aset', k: a[0], t: a[1], h: a[7], f: () => viewAsset(a[0]) })) : [];
    opts = pages.concat(assets); draw();
  }
  function openCmd() { prev = document.activeElement; cmd.hidden = false; inp.value = ''; find(''); inp.focus(); }
  function closeCmd() { cmd.hidden = true; if (prev && prev.focus) prev.focus(); }
  function run(i) { const o = opts[i]; closeCmd(); if (o) o.f(); }
  inp.addEventListener('input', () => find(inp.value));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (opts.length) { sel = (sel + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length; draw(); } }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
  });
  cmd.addEventListener('mousedown', e => { if (e.target === cmd) closeCmd(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmd.hidden ? openCmd() : closeCmd(); }

});

    const modal = document.getElementById('dca-modal').style.display === 'flex';
    if (window.__auto > 0 && (typing || modal)) { updateHeaderTime(); return; }
    return rct();
  };
  // 4) Cicilan lunas tidak lagi melewati pinjaman berikutnya (splice di dalam forEach)
  window.processLoansCycle = function () {
    const keep = [];
    State.loans.forEach(l => {
      if (State.currentDate >= l.nextDue) {
        const bill = l.installment + (l.penalty || 0);
        if (State.cash >= bill) {
          State.cash -= bill; l.paidMonths++; l.penalty = 0; l.nextDue += 30 * 86400000;
          if (l.paidMonths >= l.totalMonths) {
            addNews('Pinjaman Lunas!', `Fasilitas kredit ${l.name} telah lunas tepat waktu. Skor kredit naik +25 poin.`, false, 'pos');
            State.creditScore = Math.min(850, State.creditScore + 25);
            return;
          }
        } else {
          l.penalty = (l.penalty || 0) + l.installment * 0.06; l.nextDue += 7 * 86400000;
          State.creditScore = Math.max(300, State.creditScore - 30);
          addNews('PERINGATAN: Cicilan Gagal Bayar!', `Saldo tidak cukup untuk auto-debet ${l.name}. Denda 6% ditambahkan dan skor kredit turun.`, false, 'neg');
        }
      }
      keep.push(l);
    });
    State.loans = keep;
  };
  // 5) Simpan otomatis: tiap 10 detik, saat tab disembunyikan, dan saat halaman ditutup
  const safeSave = () => { if (State) { try { saveState(); } catch (e) {} } };
  setInterval(safeSave, 30000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) safeSave(); });
  addEventListener('pagehide', safeSave);

  /* ---------- Tab: Pembelian Rutin (DCA) ---------- */
  const freqTxt = d => d === 7 ? 'Mingguan' : d === 30 ? 'Bulanan' : d + ' hari';
  window.toggleDCA = id => { const p = State.autoInvestPlans.find(x => x.id === id); if (p) { p.active = !p.active; saveState(); renderCurrentTab(); } };
  window.removeDCA = id => { if (confirm('Hapus jadwal pembelian rutin ini?')) { State.autoInvestPlans = State.autoInvestPlans.filter(x => x.id !== id); saveState(); renderCurrentTab(); showToast('Jadwal dihapus'); } };
  window.renderAutoInvestView = function () {
    const plans = State.autoInvestPlans, act = plans.filter(p => p.active);
    const perMonth = act.reduce((s, p) => s + p.amountIDR * 30 / p.frequencyDays, 0);
    const opts = MASTER_ASSETS.filter(a => State.companyStatus[a[0]] !== 'bangkrut').map(a => `<option value="${esc(a[0])}">${esc(a[0])} · ${esc(a[1])}</option>`).join('');
    const rows = plans.map(p => {
      const a = ASSET_REGISTRY[p.ticker] || [p.ticker, p.ticker];
      return `<tr><td><b>${esc(p.ticker)}</b><br><span style="font-size:12px;color:var(--text-sub)">${esc(a[1])}</span></td><td>${rp(p.amountIDR)}</td><td>${freqTxt(p.frequencyDays)}</td><td>${p.active ? formatDate(p.nextRunDate) : '-'}</td>
      <td><span class="badge ${p.active ? 'badge-sehat' : 'badge-waspada'}">${p.active ? 'Aktif' : 'Dijeda'}</span></td>
      <td><div class="row-acts"><button class="btn" onclick="toggleDCA(${p.id})">${p.active ? 'Jeda' : 'Lanjutkan'}</button><button class="btn" onclick="viewAsset('${esc(p.ticker)}')">Analisis</button><button class="btn btn-danger" onclick="removeDCA(${p.id})">Hapus</button></div></td></tr>`;
    }).join('');
    return `<div class="grid-main"><div class="card"><div class="card-head"><h2>Jadwal Pembelian Rutin (DCA)</h2></div>
      ${plans.length ? `<div class="tbl-wrap"><table><thead><tr><th>Aset</th><th>Nominal</th><th>Frekuensi</th><th>Eksekusi berikutnya</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>` : empty('Belum ada jadwal pembelian rutin', 'Pilih aset di kanan, tentukan nominal dan frekuensinya, lalu sistem membeli otomatis setiap jadwal tiba.')}
    </div><div><div class="card"><div class="card-head"><h2>Tambah jadwal</h2></div>
      <div class="field"><label for="dca-pick">Aset yang dibeli rutin</label><select id="dca-pick">${opts}</select></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="openDCAModal(document.getElementById('dca-pick').value)">Atur nominal dan frekuensi</button></div>
      <div class="card"><div class="card-head"><h2>Ringkasan</h2></div><div class="grid-3" style="grid-template-columns:1fr 1fr">${kpi('Jadwal aktif', act.length + ' dari ' + plans.length)}${kpi('Komitmen per bulan', rp(perMonth))}</div>
      <p style="font-size:12.5px;color:var(--text-muted);margin-top:10px">Kas saat ini ${rp(State.cash)}. ${perMonth > State.cash ? '<b class="down">Kas lebih kecil dari komitmen sebulan, ada risiko pembelian gagal.</b>' : 'Cukup untuk komitmen sebulan.'}</p></div></div></div>`;
  };

  /* ---------- Tab: Portofolio ---------- */
  window.sellAll = t => {
    const pos = State.portfolio[t]; if (!pos) return;
    if (!confirm(`Jual semua ${t}?`)) return;
    const price = getAssetPriceIDR(t), net = pos.qty * price * (1 - 0.0025);
    State.cash += net; delete State.portfolio[t];
    State.txHistory.unshift({ date: State.currentDate, side: 'SELL', ticker: t, qty: pos.qty, priceIDR: price, total: net });
    reconcileOrdersAfterSale(t);
    saveState(); renderCurrentTab(); showToast(`✅ ${t} terjual semua, kas bertambah ${rp(net)}`);
  };
  window.renderPortfolioView = function () {
    const rows = Object.keys(State.portfolio).map(t => {
      const p = State.portfolio[t], price = getAssetPriceIDR(t), val = p.qty * price;
      return { t, p, price, val, pl: val - p.totalInvested, plp: p.totalInvested ? (val - p.totalInvested) / p.totalInvested : 0 };
    }).sort((a, b) => b.val - a.val);
    const hold = rows.reduce((s, r) => s + r.val, 0), cost = rows.reduce((s, r) => s + r.p.totalInvested, 0);
    const nw = getNetWorth(), ret = (nw - State.initialCapital) / State.initialCapital;
    const body = rows.map(r => `<tr class="market-row"><td onclick="viewAsset('${esc(r.t)}')"><b>${esc(r.t)}</b></td><td>${qtyTxt(r.t, r.p.qty)}</td><td>${rp(r.p.avgPriceIDR)}</td><td>${rp(r.price)}</td><td>${rp(r.val)}<br><span style="font-size:12px;color:var(--text-sub)">${hold ? (r.val / hold * 100).toFixed(1) : 0}% dari aset</span></td>
      <td>${pl(r.pl)}<br><span class="${r.pl >= 0 ? 'up' : 'down'}" style="font-size:12px">${formatPercent(r.plp)}</span></td>
      <td><div class="row-acts"><button class="btn" onclick="viewAsset('${esc(r.t)}')">Order</button><button class="btn" onclick="openDCAModal('${esc(r.t)}')">DCA</button><button class="btn btn-danger" onclick="sellAll('${esc(r.t)}')">Jual semua</button></div></td></tr>`).join('');
    const tx = State.txHistory.slice(0, 15).map(x => `<tr><td>${formatDate(x.date)}</td><td><span class="badge ${/SELL/.test(x.side) ? 'badge-bangkrut' : 'badge-sehat'}">${esc(x.side)}</span></td><td><b>${esc(x.ticker)}</b></td><td>${qtyTxt(x.ticker, x.qty)}</td><td>${rp(x.priceIDR)}</td><td>${rp(x.total)}</td></tr>`).join('');
    return `<div class="grid-4" style="margin-bottom:16px">${kpi('Kekayaan bersih', rp(nw), nw >= State.initialCapital ? 'up' : 'down')}${kpi('Imbal hasil total', formatPercent(ret), ret >= 0 ? 'up' : 'down')}${kpi('Nilai aset', rp(hold))}${kpi('Untung/rugi belum terealisasi', pl(hold - cost))}${kpi('Kas', rp(State.cash))}${kpi('Utang', rp(getTotalDebt()), getTotalDebt() ? 'down' : '')}</div>
    <div class="card"><div class="card-head"><h2>Aset yang dimiliki</h2></div>${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Aset</th><th>Jumlah</th><th>Harga rata-rata</th><th>Harga kini</th><th>Nilai</th><th>Untung/rugi</th><th>Aksi</th></tr></thead><tbody>${body}</tbody></table></div>` : empty('Portofolio masih kosong', 'Buka tab Analisis & Order untuk membeli aset pertama, atau pasang jadwal di Pembelian Rutin.')}</div>
    <div class="card"><div class="card-head"><h2>Riwayat transaksi terakhir</h2></div>${tx ? `<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Aset</th><th>Jumlah</th><th>Harga</th><th>Total</th></tr></thead><tbody>${tx}</tbody></table></div>` : empty('Belum ada transaksi', 'Transaksi beli dan jual akan tercatat di sini.')}</div>`;
  };

  /* ---------- Tab: Kredit Bank ---------- */
  const inst = (P, ratePct, n) => { const r = ratePct / 100 / 12; return r ? P * r / (1 - Math.pow(1 + r, -n)) : P / n; };
  const balance = l => {
    if (!l.principal) return l.installment * (l.totalMonths - l.paidMonths);
    const r = (l.rate || 0) / 100 / 12, n = l.totalMonths, k = l.paidMonths;
    return r ? l.principal * (Math.pow(1 + r, n) - Math.pow(1 + r, k)) / (Math.pow(1 + r, n) - 1) : l.principal * (n - k) / n;
  };
  window.previewLoan = i => {
    const p = CREDIT_PROVIDERS[i], a = num('ln-amt-' + i), n = Math.max(1, Math.round(num('ln-tnr-' + i)));
    document.getElementById('ln-prev-' + i).textContent = a > 0 ? `Cicilan ${rp(inst(a, p[1], n))} per bulan, total ${rp(inst(a, p[1], n) * n)}` : '';
  };
  window.takeLoan = i => {
    const p = CREDIT_PROVIDERS[i], a = num('ln-amt-' + i), n = Math.round(num('ln-tnr-' + i));
    if (a <= 0) return showToast('⚠️ Isi jumlah pinjaman');
    if (a > p[3]) return showToast(`❌ Melebihi plafon ${rp(p[3])}`);
    if (n < 1 || n > p[2]) return showToast(`❌ Tenor harus 1 sampai ${p[2]} bulan`);
    if (State.creditScore < p[4]) return showToast(`❌ Skor kredit ${State.creditScore} belum memenuhi syarat minimal ${p[4]}`);
    if (State.loans.some(l => l.name === p[0])) return showToast('❌ Masih ada pinjaman aktif di penyedia ini');
    const m = inst(a, p[1], n);
    State.cash += a;
    State.loans.push({ id: Date.now(), name: p[0], principal: a, rate: p[1], totalMonths: n, installment: m, paidMonths: 0, nextDue: State.currentDate + 30 * 86400000, penalty: 0 });
    addNews('Pinjaman Cair', `${p[0]}: ${rp(a)} cair, cicilan ${rp(m)} selama ${n} bulan.`, false, 'neutral');
    saveState(); renderCurrentTab(); showToast(`✅ Pinjaman ${rp(a)} cair ke kas`);
  };
  window.repayLoan = id => {
    const idx = State.loans.findIndex(l => l.id === id || l === id); const l = State.loans[idx]; if (!l) return;
    const due = Math.round(balance(l) + (l.penalty || 0));
    if (State.cash < due) return showToast(`❌ Kas kurang, butuh ${rp(due)} untuk pelunasan`);
    if (!confirm(`Lunasi sekarang sebesar ${rp(due)}?`)) return;
    State.cash -= due; State.loans.splice(idx, 1); State.creditScore = Math.min(850, State.creditScore + 10);
    addNews('Pelunasan Dipercepat', `${l.name} dilunasi lebih awal. Skor kredit naik +10.`, false, 'pos');
    saveState(); renderCurrentTab(); showToast('✅ Pinjaman lunas');
  };
  window.renderLoanView = function () {
    const sc = State.creditScore, pos = (sc - 300) / 550 * 100, cat = sc >= 740 ? 'Sangat baik' : sc >= 670 ? 'Baik' : sc >= 580 ? 'Cukup' : 'Rendah';
    const loans = State.loans.map((l, i) => {
      if (!l.id) l.id = Date.now() + i;
      return `<tr><td><b>${esc(l.name)}</b></td><td>${l.paidMonths} dari ${l.totalMonths} bulan</td><td>${rp(l.installment)}</td><td>${formatDate(l.nextDue)}</td><td>${l.penalty ? `<span class="down">${rp(l.penalty)}</span>` : '-'}</td><td>${rp(balance(l) + (l.penalty || 0))}</td><td><button class="btn btn-primary" onclick="repayLoan(${l.id})">Lunasi</button></td></tr>`;
    }).join('');
    const prov = CREDIT_PROVIDERS.map((p, i) => {
      const ok = sc >= p[4], def = Math.min(10000000, p[3]);
      return `<div class="card" style="margin:0"><h3 style="font-size:15px;margin-bottom:6px">${esc(p[0])}</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px">Bunga ${p[1]}% per tahun · tenor sampai ${p[2]} bulan · plafon ${rp(p[3])} · skor minimal ${p[4] || 'tanpa syarat'}</p>
      <div class="field"><label for="ln-amt-${i}">Jumlah pinjaman (IDR)</label><input id="ln-amt-${i}" type="number" min="0" step="1000000" value="${def}" oninput="previewLoan(${i})"></div>
      <div class="field"><label for="ln-tnr-${i}">Tenor (bulan)</label><input id="ln-tnr-${i}" type="number" min="1" max="${p[2]}" value="${p[2]}" oninput="previewLoan(${i})"></div>
      <p id="ln-prev-${i}" style="font-size:12.5px;color:var(--text-muted);min-height:20px">${rp(inst(def, p[1], p[2]))} per bulan</p>
      <button class="btn ${ok ? 'btn-primary' : ''}" style="width:100%;justify-content:center" ${ok ? '' : 'title="Skor kredit belum cukup"'} onclick="takeLoan(${i})">${ok ? 'Ajukan pinjaman' : 'Skor belum memenuhi syarat'}</button></div>`;
    }).join('');
    return `<div class="grid-main"><div class="card"><div class="card-head"><h2>Pinjaman aktif</h2></div>${State.loans.length ? `<div class="tbl-wrap"><table><thead><tr><th>Penyedia</th><th>Progres</th><th>Cicilan/bulan</th><th>Jatuh tempo</th><th>Denda</th><th>Sisa kewajiban</th><th>Aksi</th></tr></thead><tbody>${loans}</tbody></table></div>` : empty('Tidak ada pinjaman aktif', 'Ajukan kredit di bawah bila butuh tambahan modal. Cicilan dipotong otomatis dari kas tiap 30 hari.')}</div>
    <div class="card"><div class="card-head"><h2>Skor kredit</h2></div><div class="kpi"><div class="l">${cat}</div><div class="v">${sc}</div></div><div class="meter"><i style="left:calc(${pos}% - 1px)"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub)"><span>300</span><span>850</span></div>
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:10px">Naik saat pinjaman lunas, turun bila kas tidak cukup untuk cicilan. Total utang kini ${rp(getTotalDebt())}.</p></div></div>
    <div class="card"><div class="card-head"><h2>Ajukan kredit baru</h2></div><div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${prov}</div></div>`;
  };

  /* ---------- Tab: Warta Makro ---------- */
  const SENT = { pos: 'Positif', neg: 'Negatif', geo: 'Geopolitik', neutral: 'Netral' };
  window.setNewsFilter = f => { newsFilter = f; renderCurrentTab(); };
  window.renderNewsView = function () {
    const feed = State.newsFeed, present = Object.keys(SENT).filter(k => feed.some(n => (n.sent || 'neutral') === k));
    const list = feed.filter(n => newsFilter === 'all' || (n.sent || 'neutral') === newsFilter);
    const btn = (k, l) => `<button class="tag-btn ${newsFilter === k ? 'active' : ''}" onclick="setNewsFilter('${k}')">${l}</button>`;
    return `<div class="card"><div class="card-head"><h2>Warta makro dan kejadian pasar</h2><span style="font-size:12.5px;color:var(--text-sub)">${feed.length} kabar tersimpan</span></div>
    <div class="filter-bar">${btn('all', 'Semua')}${present.map(k => btn(k, SENT[k])).join('')}</div>
    ${list.length ? list.map(n => `<div class="news-item ${esc(n.sent || 'neutral')}"><h3>${esc(n.title)}</h3><p>${esc(n.desc)}</p><div class="m">Simulasi BursaBelajar · ${formatDate(n.date)} · ${SENT[n.sent || 'neutral'] || 'Netral'}</div></div>`).join('') : empty('Belum ada kabar untuk filter ini', 'Kabar baru muncul seiring simulasi berjalan dan saat ada transaksi otomatis.')}</div>`;
  };

  /* ---------- Kalkulator: fitur tambahan ---------- */
  const baseCalc = window.renderCalculatorView, baseSetup = window.setupCalcListeners;
  const card = (t, fields, out) => `<div class="card"><div class="card-head"><h2>${t}</h2></div>${fields.map(f => `<div class="field"><label for="${f[0]}">${f[1]}</label><input id="${f[0]}" type="number" step="any" value="${f[2]}"></div>`).join('')}<div style="background:var(--bg-card);padding:12px;border-radius:4px;margin-top:6px">${out}</div></div>`;
  const line = (l, id) => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:4px"><span style="color:var(--text-muted)">${l}</span><b id="${id}" style="font-family:var(--font-mono);text-align:right">-</b></div>`;
  window.renderCalculatorView = function () {
    return baseCalc() + `<div class="grid-2">
      ${card('Simulasi cicilan kredit atau KPR', [['k-p', 'Jumlah pinjaman (IDR)', 500000000], ['k-r', 'Bunga per tahun (%)', 8], ['k-y', 'Tenor (tahun)', 15]], line('Cicilan per bulan', 'k-m') + line('Total dibayar', 'k-t') + line('Total bunga', 'k-i'))}
      ${card('Berapa setoran bulanan untuk target?', [['t-g', 'Target dana (IDR)', 500000000], ['t-p', 'Dana saat ini (IDR)', 10000000], ['t-r', 'Estimasi return per tahun (%)', 10], ['t-y', 'Jangka waktu (tahun)', 10]], line('Setoran per bulan', 't-m') + line('Total disetor', 't-s') + line('Hasil dari imbal hasil', 't-h'))}
      ${card('Nilai uang setelah inflasi', [['i-v', 'Nilai uang sekarang (IDR)', 100000000], ['i-r', 'Inflasi per tahun (%)', 3.5], ['i-y', 'Lama (tahun)', 10], ['i-g', 'Return investasi per tahun (%)', 12]], line('Daya beli setara hari ini', 'i-real') + line('Butuh nominal agar setara', 'i-need') + line('Waktu uang berlipat (aturan 72)', 'i-72'))}
      ${card('Dana kebebasan finansial (aturan 4%)', [['f-e', 'Pengeluaran per bulan (IDR)', 10000000], ['f-w', 'Batas tarik per tahun (%)', 4]], line('Dana yang dibutuhkan', 'f-need') + line('Dana darurat 6 bulan', 'f-emg'))}
    </div>`;
  };
  window.setupCalcListeners = function () {
    baseSetup();
    const set = (id, v) => document.getElementById(id).textContent = v;
    const run = () => {
      const P = num('k-p'), n = num('k-y') * 12, m = n > 0 ? inst(P, num('k-r'), n) : 0;
      set('k-m', rp(m)); set('k-t', rp(m * n)); set('k-i', rp(m * n - P));
      const r = num('t-r') / 1200, N = num('t-y') * 12, g = num('t-g') - num('t-p') * Math.pow(1 + r, N);
      const pm = N <= 0 ? 0 : Math.max(0, r ? g * r / (Math.pow(1 + r, N) - 1) : g / N);
      set('t-m', rp(pm)); set('t-s', rp(pm * N + num('t-p'))); set('t-h', rp(Math.max(0, num('t-g') - pm * N - num('t-p'))));
      const inf = num('i-r') / 100, y = num('i-y');
      set('i-real', rp(num('i-v') / Math.pow(1 + inf, y))); set('i-need', rp(num('i-v') * Math.pow(1 + inf, y))); set('i-72', num('i-g') > 0 ? (72 / num('i-g')).toFixed(1) + ' tahun' : '-');
      set('f-need', num('f-w') > 0 ? rp(num('f-e') * 12 / (num('f-w') / 100)) : '-'); set('f-emg', rp(num('f-e') * 6));
    };
    ['k-p', 'k-r', 'k-y', 't-g', 't-p', 't-r', 't-y', 'i-v', 'i-r', 'i-y', 'i-g', 'f-e', 'f-w'].forEach(id => document.getElementById(id).addEventListener('input', run));
    run();
  };
})();
</script>

/* ===== PATCH: utang pada Kekayaan Bersih = sisa pokok + denda (konsisten dengan tab Pinjaman) ===== */
(function () {
  function loanBalance(l) {
    if (!l.principal) return l.installment * (l.totalMonths - l.paidMonths);
    const r = (l.rate || 0) / 100 / 12, n = l.totalMonths, k = l.paidMonths;
    return r ? l.principal * (Math.pow(1 + r, n) - Math.pow(1 + r, k)) / (Math.pow(1 + r, n) - 1)
             : l.principal * (n - k) / n;
  }
  window.getTotalDebt = function () {
    return (State.loans || []).reduce(function (acc, l) { return acc + loanBalance(l) + (l.penalty || 0); }, 0);
  };
})();
</script>
